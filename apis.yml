aid: yunjichina
name: Yunji
description: >-
  Yunji (云集) is a leading membership-based social e-commerce platform in China,
  founded in Hangzhou in May 2015. Yunji curates a wide range of consumer products
  across health food, beauty, personal care, digital devices, and apparel, and uses
  a member-driven model in which members earn rewards by sharing products with their
  social contacts. The company applies big data and artificial intelligence to
  optimize the shopping experience and incentivize social promotion. Yunji listed
  on the Nasdaq Stock Exchange (ticker YJ) in May 2019 as the first membership-based
  Chinese e-commerce firm to do so. Yunji was surfaced as a portfolio company of
  Qiming Venture Partners and added to the API Evangelist network. As of this
  enrichment pass, Yunji operates as a consumer mobile-app commerce platform and
  publishes no public developer or open API program.
